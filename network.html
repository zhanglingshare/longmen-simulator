  <h1>龙门的关系网</h1>
  <p class="sub">看不懂图记住这三个：南昆山、广州深圳的游客、年桔。</p>

  <div class="card" style="margin-top:12px">
    <div id="chart"></div>
  </div>

  <div class="card">
    <div class="tip">
      <b style="color:#fca5a5">📍 南昆山</b>——龙门的命门，北回归线上的绿洲。一年几百万游客从这过。<br>
      <b style="color:#93c5fd">📍 广州深圳的游客</b>——每周末上来的人，是龙门的衣食父母。<br>
      <b style="color:#fbbf24">📍 年桔/西溪笋</b>——山里的好东西，怎么卖出溢价？<br><br>
      龙门和博罗不一样：博罗连着东莞的工厂，龙门连着广州深圳的周末。
    </div>
  </div>
