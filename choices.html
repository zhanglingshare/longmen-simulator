<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>龙门五条路</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="model.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e6edf3;font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:5px;align-items:center;padding:9px 14px;background:rgba(8,11,18,.95);border-bottom:1px solid #1b2434;overflow-x:auto}
.nav b{font-size:14px;margin-right:6px;flex:none}
.nav a{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.nav a.on{background:#059669;border-color:#22c55e;color:#fff;font-weight:600}
.wrap{max-width:680px;margin:auto;padding:16px}
.card{background:#0e1523;border:1px solid #1c2739;border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#8fa3bf;font-size:13px}
h2{font-size:16px;margin:0 0 8px}
.path{border:1px solid #1c2739;border-radius:12px;padding:14px;margin-bottom:10px;background:#0e1523;cursor:pointer}
.path.on{border-color:#22c55e}
.path .t{font-size:15px;font-weight:700;color:#fff}
.path .d{font-size:12.5px;color:#a9b6c9;margin-top:6px;line-height:1.8}
.path .feel{font-size:12.5px;color:#7dd3fc;margin-top:6px}
.path .num{font-size:13px;color:#fbbf24;font-weight:800;margin-top:6px}
.gap{background:#131c2b;border-radius:10px;padding:12px;margin-top:10px;text-align:center}
.gap .v{font-size:22px;font-weight:800;color:#fbbf24}
.chart{width:100%;height:220px;margin-top:8px}
</style></head><body>

<div class="nav">

<div class="wrap">
  <h1>龙门到330亿，靠哪五条路</h1>
  <p class="sub">不是补齐工业，是把绿水青山变成金山银山。点每条路开关，看缺口怎么变。</p>

  <div id="paths"></div>

  <div class="card">
    <h2>📊 五条路各贡献多少</h2>
    <div id="barChart" class="chart"></div>
  </div>

  <div class="gap">
    <div style="font-size:12px;color:#94a3b8">离330亿目标还差</div>
    <div class="v" id="gap">—</div>
    <div style="font-size:11px;color:#64748b;margin-top:4px">从217.62亿到330亿，差约112亿</div>
  </div>
</div>
<script>
const DATA=[
  {icon:"🛏️",t:"一张床·南昆山留宿",d:"民宿从夏天旺季卖到四季，把一日游变成过夜游，把客单价拉回来。",feel:"走通了你会感到：周末民宿更满、淡季不空房",mu:32,c:'#a78bfa'},
  {icon:"🎞️",t:"功能膜新材料",d:"68宗项目、140亿投资、620条涂布线。达产了，二产和规上工业的剪刀差才合上。",feel:"走通了你会感到：工业园真正转起来",mu:30,c:'#f97316'},
  {icon:"♨️",t:"温泉康养",d:"地派、南昆山温泉，从冬天火到四季康养客。",feel:"走通了你会感到：温泉不再只靠冬天",mu:22,c:'#fbbf24'},
  {icon:"🍊",t:"生态农业品牌",d:"年桔、西溪笋，从论斤卖原料到论品牌卖生活方式。",feel:"走通了你会感到：你家年桔卖出溢价",mu:16,c:'#84cc16'},
  {icon:"🚗",t:"融深融穗通道",d:"武深、广河高速，广深客1.5小时到，周末消费带上来。",feel:"走通了你会感到：广深客来得更勤",mu:12,c:'#38bdf8'}
];
const GAP=112;
function render(){
  document.getElementById("paths").innerHTML=DATA.map((p,i)=>
    `<div class="path on" id="p${i}" onclick="this.classList.toggle('on');calc()">
      <div class="t">${p.icon} ${p.t}</div><div class="d">${p.d}</div>
      <div class="feel">→ ${p.feel}</div><div class="num">5年累计 ~${p.mu}亿</div>
    </div>`).join("");
}
let barChart;
function calc(){
  let sum=0;const active=[];
  DATA.forEach((p,i)=>{if(document.getElementById("p"+i).classList.contains("on")){sum+=p.mu;active.push(p);}});
  document.getElementById("gap").textContent=(GAP-sum)+"亿";
  if(!barChart)barChart=echarts.init(document.getElementById('barChart'));
  barChart.setOption({
    backgroundColor:'transparent',grid:{left:90,right:30,top:10,bottom:20},
    xAxis:{type:'value',axisLabel:{color:'#64748b'}},
    yAxis:{type:'category',data:active.map(p=>p.t),axisLabel:{color:'#cbd5e1',fontSize:11}},
    series:[{type:'bar',data:active.map(p=>({value:p.mu,itemStyle:{color:p.c}}))}]
  });
}
render();calc();
</script>
</body></html>
