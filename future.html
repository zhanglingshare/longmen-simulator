<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1a;color:#e6edf3;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:12px}
.nav a{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.nav a.on{background:#059669;color:#fff;border-color:#059669}
.card{background:#0f172a;border:1px solid #1c2739;border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin-bottom:4px}
.sub{font-size:13px;color:#94a3b8;line-height:1.7}
.stat{display:inline-block;text-align:center;width:30%;padding:10px 0;background:#131c2b;border-radius:10px;margin:1%}
.stat .v{font-size:18px;font-weight:800;color:#fbbf24}
.stat .l{font-size:11px;color:#94a3b8;margin-top:2px}
#chart{width:100%;height:300px;margin-top:10px}
button{cursor:pointer;font-family:inherit}
</style>
</head>
<body>

  <h1>2030年龙门长什么样</h1>
  <p class="sub">把未来反复跑一万遍，看结果落在哪。</p>

  <!-- 先猜后揭 -->
  <div class="card" style="margin-top:12px;border-color:#fbbf24">
    <div style="font-size:15px;font-weight:800;color:#fff;margin-bottom:4px">🎯 先别往下看——你觉得2030年龙门最可能落到多少？</div>
    <div style="font-size:12.5px;color:#94a3b8;margin-bottom:12px">凭直觉选一个，再看模型跑出来的结果。</div>
    <div style="display:flex;gap:8px">
      <button onclick="guess(1)" style="flex:1;background:#f8717122;border:1px solid #f87171;color:#f87171;border-radius:10px;padding:10px 6px;cursor:pointer;font-size:13px;font-weight:700">280亿以下</button>
      <button onclick="guess(2)" style="flex:1;background:#fbbf2422;border:1px solid #fbbf24;color:#fbbf24;border-radius:10px;padding:10px 6px;cursor:pointer;font-size:13px;font-weight:700">280-330亿</button>
      <button onclick="guess(3)" style="flex:1;background:#34d39922;border:1px solid #34d399;color:#34d399;border-radius:10px;padding:10px 6px;cursor:pointer;font-size:13px;font-weight:700">330亿以上</button>
    </div>
    <div id="guessOut" style="margin-top:10px;font-size:12.5px;color:#cbd5e1"></div>
  </div>

  <div class="card">
    <div class="stat"><div class="v" id="p10">—</div><div class="l">较差情景</div></div>
    <div class="stat"><div class="v" id="p50">—</div><div class="l">中位数</div></div>
    <div class="stat"><div class="v" id="p90">—</div><div class="l">较好情景</div></div>
    <div style="margin-top:10px;font-size:13px;color:#94a3b8">达标概率（到330亿）：<span id="hit" style="color:#fbbf24;font-weight:800">—</span></div>
    <div id="chart"></div>
  </div>
</div>
<script>
const m=HT.run(42,10000);
document.getElementById('p10').textContent=Math.round(m.p10)+'亿';
document.getElementById('p50').textContent=Math.round(m.p50)+'亿';
document.getElementById('p90').textContent=Math.round(m.p90)+'亿';
document.getElementById('hit').textContent=m.hit.toFixed(1)+'%';
echarts.init(document.getElementById('chart')).setOption({
  backgroundColor:'transparent',
  xAxis:{type:'value',axisLabel:{color:'#64748b'}},
  yAxis:{type:'value',axisLabel:{color:'#64748b'}},
  series:[{type:'histogram',data:m.results.filter((_,i)=>i%50===0),itemStyle:{color:'#059669'}}]
});
function guess(n){
  const msgs={
    1:"你偏谨慎。模型跑出来中位数约330亿——比你猜的要乐观。",
    2:"你猜在中间。模型中位数约330亿，正好落在你这个区间。",
    3:"你偏乐观。模型跑出来只有约49%的概率过330亿——比你想的要难。"
  };
  document.getElementById("guessOut").innerHTML="揭晓："+msgs[n];
}
</script>
