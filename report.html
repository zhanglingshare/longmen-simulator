  <h1>龙门一页报告</h1>
  <p class="sub">用公开数据，把龙门讲清楚。</p>

  <div class="card" style="margin-top:12px">
    <div style="font-size:14px;line-height:2.1;color:#c8d3e0">
      <b style="color:#fbbf24">龙门是什么：</b>大湾区的生态后花园，217亿GDP，76%森林覆盖率。<br><br>
      <b style="color:#4ade80">龙门要做什么：</b>不是补齐工业，是把绿水青山变成金山银山。南昆山民宿从夏天卖到四季，年桔从论斤卖变成论品牌卖。<br><br>
      <b style="color:#60a5fa">龙门最该先做什么：</b>让南昆山淡季不空房，让年桔卖出溢价。这两件事成了，330亿就有了。<br><br>
